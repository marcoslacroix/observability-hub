services:

  # 1. O Coletor OpenTelemetry (Recebe os traces e logs da aplicação)
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # Porta gRPC do OTLP
      - "4318:4318" # Porta HTTP do OTLP
    depends_on:
      - tempo
      - loki

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/loki.yaml"
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025" # Interface Web para visualizar e-mails de alerta (http://localhost:8025)
      - "1025:1025" # Servidor SMTP

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - JIRA_URL=${URL_JIRA:-https://sua-empresa.atlassian.net}
      - JIRA_USER=${EMAIL_JIRA:-usuario@empresa.com}
      - JIRA_API_TOKEN=${TOKEN_JIRA:-}
      - JIRA_USER_LABEL=${JIRA_USER_LABEL:-Usuário}
      - JIRA_ASSIGNEE_1_LABEL=${JIRA_ASSIGNEE_1_LABEL:-Dev 1}
      - JIRA_ASSIGNEE_1_NAME=${JIRA_ASSIGNEE_1_NAME:-Dev 1}
      - JIRA_ASSIGNEE_2_LABEL=${JIRA_ASSIGNEE_2_LABEL:-Dev 2}
      - JIRA_ASSIGNEE_2_NAME=${JIRA_ASSIGNEE_2_NAME:-Dev 2}
      - JIRA_ASSIGNEE_3_LABEL=${JIRA_ASSIGNEE_3_LABEL:-Dev 3}
      - JIRA_ASSIGNEE_3_NAME=${JIRA_ASSIGNEE_3_NAME:-Dev 3}
      - JIRA_ASSIGNEE_4_LABEL=${JIRA_ASSIGNEE_4_LABEL:-Dev 4}
      - JIRA_ASSIGNEE_4_NAME=${JIRA_ASSIGNEE_4_NAME:-Dev 4}
      - JIRA_ASSIGNEE_5_LABEL=${JIRA_ASSIGNEE_5_LABEL:-Dev 5}
      - JIRA_ASSIGNEE_5_NAME=${JIRA_ASSIGNEE_5_NAME:-Dev 5}
      - JIRA_ASSIGNEE_6_LABEL=${JIRA_ASSIGNEE_6_LABEL:-Dev 6}
      - JIRA_ASSIGNEE_6_NAME=${JIRA_ASSIGNEE_6_NAME:-Dev 6}
      - JIRA_ASSIGNEE_7_LABEL=${JIRA_ASSIGNEE_7_LABEL:-Dev 7}
      - JIRA_ASSIGNEE_7_NAME=${JIRA_ASSIGNEE_7_NAME:-Dev 7}
      - JIRA_ASSIGNEE_8_LABEL=${JIRA_ASSIGNEE_8_LABEL:-Dev 8}
      - JIRA_ASSIGNEE_8_NAME=${JIRA_ASSIGNEE_8_NAME:-Dev 8}
      - JIRA_ASSIGNEE_9_LABEL=${JIRA_ASSIGNEE_9_LABEL:-Dev 9}
      - JIRA_ASSIGNEE_9_NAME=${JIRA_ASSIGNEE_9_NAME:-Dev 9}
      - JIRA_ASSIGNEE_10_LABEL=${JIRA_ASSIGNEE_10_LABEL:-Dev 10}
      - JIRA_ASSIGNEE_10_NAME=${JIRA_ASSIGNEE_10_NAME:-Dev 10}
      - JIRA_ASSIGNEE_11_LABEL=${JIRA_ASSIGNEE_11_LABEL:-Dev 11}
      - JIRA_ASSIGNEE_11_NAME=${JIRA_ASSIGNEE_11_NAME:-Dev 11}
      # Configuração de SMTP e destinatário para alertas por e-mail
      - ALERT_EMAIL_TO=${EMAIL_JIRA}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST:-mailpit:1025}
      - GF_SMTP_USER=${SMTP_USER:-}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-alertas@observability-hub.local}
      - GF_SMTP_FROM_NAME=Grafana Observability Hub
      - GF_SMTP_SKIP_VERIFY=true
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /tmp/dashboards
        cp /etc/grafana/provisioning/dashboards/*.json /tmp/dashboards/
        sed -i \
          -e "s|\$${JIRA_URL}|$${JIRA_URL}|g" \
          -e "s|\$${JIRA_USER_LABEL}|$${JIRA_USER_LABEL}|g" \
          -e "s|\$${JIRA_ASSIGNEE_1_LABEL}|$${JIRA_ASSIGNEE_1_LABEL}|g" \
          -e "s|\$${JIRA_ASSIGNEE_1_NAME}|$${JIRA_ASSIGNEE_1_NAME}|g" \
          -e "s|\$${JIRA_ASSIGNEE_2_LABEL}|$${JIRA_ASSIGNEE_2_LABEL}|g" \
          -e "s|\$${JIRA_ASSIGNEE_2_NAME}|$${JIRA_ASSIGNEE_2_NAME}|g" \
          -e "s|\$${JIRA_ASSIGNEE_3_LABEL}|$${JIRA_ASSIGNEE_3_LABEL}|g" \
          -e "s|\$${JIRA_ASSIGNEE_3_NAME}|$${JIRA_ASSIGNEE_3_NAME}|g" \
          -e "s|\$${JIRA_ASSIGNEE_4_LABEL}|$${JIRA_ASSIGNEE_4_LABEL}|g" \
          -e "s|\$${JIRA_ASSIGNEE_4_NAME}|$${JIRA_ASSIGNEE_4_NAME}|g" \
          -e "s|\$${JIRA_ASSIGNEE_5_LABEL}|$${JIRA_ASSIGNEE_5_LABEL}|g" \
          -e "s|\$${JIRA_ASSIGNEE_5_NAME}|$${JIRA_ASSIGNEE_5_NAME}|g" \
          -e "s|\$${JIRA_ASSIGNEE_6_LABEL}|$${JIRA_ASSIGNEE_6_LABEL}|g" \
          -e "s|\$${JIRA_ASSIGNEE_6_NAME}|$${JIRA_ASSIGNEE_6_NAME}|g" \
          -e "s|\$${JIRA_ASSIGNEE_7_LABEL}|$${JIRA_ASSIGNEE_7_LABEL}|g" \
          -e "s|\$${JIRA_ASSIGNEE_7_NAME}|$${JIRA_ASSIGNEE_7_NAME}|g" \
          -e "s|\$${JIRA_ASSIGNEE_8_LABEL}|$${JIRA_ASSIGNEE_8_LABEL}|g" \
          -e "s|\$${JIRA_ASSIGNEE_8_NAME}|$${JIRA_ASSIGNEE_8_NAME}|g" \
          -e "s|\$${JIRA_ASSIGNEE_9_LABEL}|$${JIRA_ASSIGNEE_9_LABEL}|g" \
          -e "s|\$${JIRA_ASSIGNEE_9_NAME}|$${JIRA_ASSIGNEE_9_NAME}|g" \
          -e "s|\$${JIRA_ASSIGNEE_10_LABEL}|$${JIRA_ASSIGNEE_10_LABEL}|g" \
          -e "s|\$${JIRA_ASSIGNEE_10_NAME}|$${JIRA_ASSIGNEE_10_NAME}|g" \
          -e "s|\$${JIRA_ASSIGNEE_11_LABEL}|$${JIRA_ASSIGNEE_11_LABEL}|g" \
          -e "s|\$${JIRA_ASSIGNEE_11_NAME}|$${JIRA_ASSIGNEE_11_NAME}|g" \
          /tmp/dashboards/jira-dashboard.json
        exec /run.sh
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - pyroscope
      - tempo
      - loki
      - mailpit

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200" # Apenas a API do Tempo exposta para o Grafana

  pyroscope:
    image: grafana/pyroscope:latest
    container_name: pyroscope
    ports:
      - "4040:4040"
    command:
      - "server"
      - "-metastore.min-ready-duration=0"

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT_INTERNAL
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080" # Interface Web do Kafka UI (http://localhost:8085)
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_NAME=observability-hub-local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka

  observability-hub:
    build: .
    container_name: observability-hub
    ports:
      - "8080:8080"
    environment:
      - PYROSCOPE_APPLICATION_NAME=observability-hub
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
      - PYROSCOPE_PROFILER_EVENT=itimer
      - PYROSCOPE_PROFILER_ALLOC=512k
      - PYROSCOPE_PROFILER_LOCK=10ms
      - OTEL_SERVICE_NAME=observability-hub
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_LOGS_EXPORTER=otlp
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - pyroscope
      - tempo
      - loki
      - otel-collector
      - kafka
