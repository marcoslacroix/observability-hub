spring:
  application:
    name: observability-hub
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        max.block.ms: 5000 # Evita prender threads do Tomcat por 60s caso o broker atrase metadados/buffer
        linger.ms: 5       # Agrupa mensagens em micro-lotes de até 5ms para melhorar vazão em stress test
    consumer:
      group-id: observability-hub-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    template:
      observation-enabled: true # Ativa propagação de traceId/spanId (OpenTelemetry) e métricas no KafkaTemplate
    listener:
      observation-enabled: true # Ativa propagação de traceId/spanId (OpenTelemetry) e métricas no @KafkaListener

app:
  kafka:
    topics:
      user-registrations: user-registrations-topic
      custom-events: observability-events-topic

management:
  tracing:
    sampling:
      probability: 1.0 # 1.0 = 100% das requisições rastreadas (ajuste em produção)
  opentelemetry:
    tracing:
      export:
        otlp:
          # OTLP HTTP do OpenTelemetry Collector (encaminha para o Tempo)
          endpoint: "${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}"
    logging:
      export:
        otlp:
          # OTLP HTTP do OpenTelemetry Collector (encaminha para o Loki)
          endpoint: "${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}"
  otlp:
    metrics:
      export:
        # O starter de OpenTelemetry traz o registry OTLP de métricas, mas as métricas
        # já são coletadas pelo Prometheus (/actuator/prometheus) e o Tempo não recebe métricas.
        enabled: false

  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: observability-hub # Nome da aplicação que aparecerá no Grafana

logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-}%X{trace_id:-},spanId=%X{spanId:-}%X{span_id:-}]"
