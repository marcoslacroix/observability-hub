apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040

  - name: Jira
    uid: jira
    type: yesoreyeram-infinity-datasource
    access: proxy
    basicAuth: true
    basicAuthUser: ${JIRA_USER}
    editable: true
    jsonData:
      auth_method: basicAuth
      allowedHosts:
        - ${JIRA_URL}
    secureJsonData:
      basicAuthPassword: ${JIRA_API_TOKEN}

  - name: Bitbucket
    uid: bitbucket
    type: yesoreyeram-infinity-datasource
    access: proxy
    editable: true
    jsonData:
      auth_method: bearerToken
      allowedHosts:
        - https://api.bitbucket.org
    secureJsonData:
      bearerToken: ${BITBUCKET_APP_PASSWORD}

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          name: TraceID
          url: "$${__value.raw}"
        - datasourceUid: tempo
          matcherRegex: "traceId=([a-f0-9]+)"
          name: TraceID
          url: "$${__value.raw}"

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{service_name=~".+"} | trace_id = "$${__trace.traceId}"'
      tracesToProfiles:
        datasourceUid: pyroscope
        profileTypeId: process_cpu:cpu:nanoseconds:cpu:nanoseconds
        tags:
          - key: service.name
            value: service_name
